parseq_settings:
  eval_parseq_checkpoint_path: 'checkpoint/parseq.pt'
  eval_parseq_repo_path: 'parseq'

model:
  base_learning_rate: 1e-06
  target: ldm.models.diffusion.ddpm_5.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0155
    log_every_t: 100
    timesteps: 1000
    loss_type: l2
    first_stage_key: image
    cond_stage_key: LR_image
    image_size: 32
    image_height: 32
    image_width: 128
    channels: 3
    concat_mode: true
    cond_stage_trainable: false
    conditioning_key: hybrid
    text_prior_enable: true
    text_condition_enable: true
    recog_loss_enable: true
    aux_clip_enable: false
    aux_clip_context_dim: 95
    multi_lr_attn_enable: true
    down_sample_rate: 2
    STN_enable: true
    monitor: accuracy

    load_only_unet: false
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 18
        out_channels: 3
        model_channels: 160
        attention_resolutions:
        - 16
        - 8
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 2
        - 4
        num_head_channels: 32
        use_spatial_transformer: false
        spatial_transformer_config:
          attention_resolutions:
          - 8
          - 4
          - 2
          - 1
          num_heads: 8
        use_both_transformer: true
        transformer_depth: 1
        context_dim: 95
        use_checkpoint: false
        legacy: false

    first_stage_config:
      target: ldm.models.autoencoder.VQModelInterface
      params:
        embed_dim: 3
        n_embed: 8192
        monitor: val/rec_loss
        ckpt_path: 'checkpoint/vqgan_plate_model.ckpt'
        ddconfig:
          double_z: false
          z_channels: 3
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.tp_generator.PARSeqTPG
      params:
        target_dim: 95
        checkpoint_path: 'checkpoint/parseq.pt'
        parseq_repo_path: 'parseq'
        use_format_constraint: false
        freeze_backbone: true

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 32
    wrap: false
    num_workers: 0
    train:
      target: ldm.data.textzoom.plateFolderDataset
      params:
        roots: [
          '<TRAIN_DATA_ROOT>'
        ]
        voc_type: 'all'
        max_len: 100
        num_lr: 5
        num_hr: 5
        hr_target_index: 3
        random_hr: false
        random_main_lr: true
        main_lr_index: 3
        sync_hr_with_main_lr: false
        hr_select_by_parseq: false
        annotation_required: true
        fallback_to_plate_name: false

    validation:
      target: ldm.data.textzoom.plateFolderDataset
      params:
        roots: [
          '<VAL_DATA_ROOT>'
        ]
        voc_type: 'all'
        max_len: 100
        num_lr: 5
        num_hr: 5
        hr_target_index: 3
        random_hr: false
        random_main_lr: false
        main_lr_index: 3
        sync_hr_with_main_lr: true
        hr_select_by_parseq: false
        annotation_required: true
        fallback_to_plate_name: false

    train_align_collate_fn:
      target: ldm.data.textzoom.alignCollate_realWTL
      params:
        imgH: 32
        imgW: 128
        down_sample_scale: 2
        mask: false
        train: true

    val_align_collate_fn:
      target: ldm.data.textzoom.alignCollate_realWTL
      params:
        imgH: 32
        imgW: 128
        down_sample_scale: 2
        mask: false
        train: false

lightning:
  trainer:
    max_epochs: 500
