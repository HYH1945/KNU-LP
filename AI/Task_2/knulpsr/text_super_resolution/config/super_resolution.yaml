MODEL:


TRAIN:
	  train_data_dir: [
	    '<TRAIN_DATA_ROOT>'
  ]
  batch_size: 512
  width: 128
  height: 32
  epochs: 500
  cuda: True
  ngpu: 4
  workers: 0
  resume: ''
  ckpt_dir: './ckpt/with_test'
  voc_type: 'all' #'digits lower upper all'
  saveInterval: 200
  displayInterval: 50 #display loss
  adadelta: False
  lr: 0.001
  adam: True
  optimizer: "Adam"
  beta1: 0.5
  manualSeed: 1234
  max_len: 100
  keep_ratio: False
  down_sample_scale: 2

  VAL:
    val_data_dir: [
	    '<TEST_DATA_ROOT>'
      #../../DB/demo_results/原图1,
      #../../DB/demo_results/中度模糊,
      #../../DB/demo_results/QQ截图20210901171814,
      #../../DB/demo_results/原图2,

    ]
    n_vis: 10
    vis_dir: 'demo'
    valInterval: 800 #-1, val at the end of epoch
    rec_pretrained: 'aster.pth.tar'
    moran_pretrained: 'moran.pth'
    crnn_pretrained: 'crnn.pth'

TEST:
  checkpoint: ''
  test_data_dir: [
  ]

CONVERT:
  image_dir:
  lmdb_dir:
  n_convert: 10
