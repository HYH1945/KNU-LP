# dataset.yaml 템플릿
# train_main.py 실행 전 이 파일을 프로젝트 루트에 두고 path를 수정하세요

# 절대경로 또는 상대경로 모두 가능
path: ./dataset
train: images/train
val: images/valid

nc: 1
names: ['license_plate']

# ─────────────────────────────────────────────
# 디렉토리 구조 (참고)
#
# dataset/
# ├── images/
# │   ├── train/   frame_0001.jpg ...
# │   └── valid/     frame_0101.jpg ...
# └── labels/
#     ├── train/   frame_0001.txt ...
#     └── valid/     frame_0101.txt ...
#
# 라벨 .txt 포맷 (YOLO seg):
#   class_id x1 y1 x2 y2 x3 y3 ... xn yn
#   좌표는 이미지 너비/높이로 정규화된 0~1 값
#
# 예시:
#   0 0.156 0.333 0.469 0.333 0.469 0.500 0.156 0.500
# ─────────────────────────────────────────────
